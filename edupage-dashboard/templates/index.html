<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Školský prehľad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🎒</span>
      <div>
        <h1>Školský prehľad</h1>
        <p class="sub" id="updated">Načítavam…</p>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <button class="btn" id="refresh" title="Stiahnuť nové údaje z EduPage">↻ Obnoviť</button>
  </header>
  {% if demo %}<div class="demo-banner">Ukážkový režim – zobrazujú sa vymyslené údaje. Vyplň <code>config.yaml</code> pre skutočné dáta z EduPage.</div>{% endif %}
  <main id="app"></main>
  <script>window.REFRESH_MINUTES = {{ refresh }};</script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
